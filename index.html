<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfe" />
    <title>TutorOS</title>
    <meta
      name="description"
      content="TutorOS - the private teaching operations system for tracking classes, hours, packages and payments."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TutorOS" />
    <meta
      property="og:description"
      content="TutorOS - the private teaching operations system for tracking classes, hours, packages and payments."
    />
    <meta property="og:site_name" content="TutorOS" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
    <script>
      (function () {
        try {
          let t = localStorage.getItem("tutoros.theme") || "system";
          let r =
            t === "system"
              ? matchMedia("(prefers-color-scheme:dark)").matches
                ? "dark"
                : "light"
              : t;
          let e = document.documentElement;
          e.setAttribute("data-theme", r);
          e.setAttribute(
            "data-density",
            localStorage.getItem("tutoros.density") || "comfortable",
          );
          let d = localStorage.getItem("tutoros.dir") || "ltr";
          e.setAttribute("dir", d);
          e.setAttribute(
            "lang",
            localStorage.getItem("tutoros.locale") || "en",
          );
          if (d === "rtl") {
            e.setAttribute("data-bs-rtl", "1");
          }
        } catch (err) {}
      })();
    </script>
  </head>
</html>
